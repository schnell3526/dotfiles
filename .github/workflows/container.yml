name: コンテナテスト

on: push

jobs:
  docker_test:
    runs-on: ubuntu-26.04
    container: ubuntu:latest@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install required packages
      run: apt-get update && apt-get install -y zsh
    - name: Install dotfiles
      run: ./setup.sh --no-brew
    - name: Syntax check
      run: zsh -n zsh/.zshrc
