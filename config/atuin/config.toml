# atuin: https://docs.atuin.sh/configuration/config/
# 同期は使わずローカルのみ（使う場合は `atuin register` / `atuin login`）
auto_sync = false
update_check = false

style = "compact"
inline_height = 20
show_preview = true
# Enter で即実行せず、コマンドラインに貼るだけ（Tab と同じ）
enter_accept = false

# 起動時は「全履歴」、Ctrl-R を押すたびに global / host / session / directory を切替
filter_mode = "global"
